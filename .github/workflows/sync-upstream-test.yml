name: Sync Upstream Test

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-test-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream test into fork test
        env:
          FORK_SYNC_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          # Добавляем upstream руководителя и забираем только нужную ветку.
          git remote add upstream https://github.com/vldsmelov/converter.git 2>/dev/null || true
          git fetch upstream test

          # Настраиваем push в fork через repo secret с правом workflow.
          git remote add fork https://x-access-token:${FORK_SYNC_TOKEN}@github.com/vvv-web/converter.git 2>/dev/null || true
          git remote set-url fork https://x-access-token:${FORK_SYNC_TOKEN}@github.com/vvv-web/converter.git

          # Делаем fork/test зеркалом upstream/test.
          git checkout -B test FETCH_HEAD
          git push --force fork test
