name: CI

on:
  push:
  pull_request:

jobs:
  dockerfile-nonroot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # СБ: контейнеры приложений не должны выполняться от root (см. docker-compose.vps.yml / служебку).
      - name: Проверка USER в Dockerfile сервисов
        run: |
          set -euo pipefail
          for f in services/nsi/Dockerfile services/documents/Dockerfile services/conversion/Dockerfile services/seed/Dockerfile services/e2e/Dockerfile; do
            grep -qE '^USER[[:space:]]' "$f" || { echo "::error file=$f::Нет директивы USER — процесс будет root."; exit 1; }
          done
          echo "OK: non-root USER задан во всех сервисных Dockerfile."

  vps-compose-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # СБ: проверяем не текстовый grep, а effective config после подстановки compose defaults.
      - name: Render VPS Compose effective config
        env:
          CONVERTER_FQDN: converter.acom-offer-desk.ru
          CONVERTER_PUBLIC_ORIGIN: https://converter.acom-offer-desk.ru
          CONVERTER_KEYCLOAK_ISSUER_PUBLIC: https://converter.acom-offer-desk.ru/auth/realms/uom
          MINIO_ROOT_USER: ci_minio_storage
          MINIO_ROOT_PASSWORD: dummy
          KEYCLOAK_DB_PASSWORD: dummy_keycloak_db
          NSI_DB_PASSWORD: dummy_nsi_db
          DOCUMENTS_DB_PASSWORD: dummy_documents_db
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: dummy
          NSI_DJANGO_SECRET_KEY: dummy
          DOCS_DJANGO_SECRET_KEY: dummy
          S2S_CLIENT_SECRET: dummy
          RABBITMQ_DEFAULT_USER: converter_ci_mq
          RABBITMQ_DEFAULT_PASS: dummy_ci_mq_pass
          NSI_DATABASE_URL: postgres://nsi:dummy_nsi_db@nsi_db:5432/nsi?sslmode=verify-full&sslrootcert=/etc/postgresql/tls/root.crt
          DOCUMENTS_DATABASE_URL: postgres://documents:dummy_documents_db@documents_db:5432/documents?sslmode=verify-full&sslrootcert=/etc/postgresql/tls/root.crt
          SEED_PASSWORD: dummy_seed_password
        run: docker compose -f docker-compose.vps.yml config --format json > /tmp/converter-vps-compose.json
      - name: Validate VPS Compose and env example SB invariants
        run: |
          set -euo pipefail
          python .github/scripts/check_vps_compose_security.py /tmp/converter-vps-compose.json deploy/vps/.env.example

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:strict
      - run: npm run build

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r services/nsi/requirements.txt -r services/documents/requirements.txt -r services/conversion/requirements.txt -r services/e2e/requirements.txt
      - run: pip install ruff
      - run: python -m compileall services
      - run: ruff check services/nsi/apps services/nsi/nsi_service services/documents/apps services/documents/documents_service services/conversion/app
      - name: Django checks (NSI)
        env:
          DATABASE_URL: sqlite:////tmp/nsi.sqlite3
          KEYCLOAK_ISSUER: http://localhost/realms/uom
          KEYCLOAK_JWKS_URL: http://localhost/jwks
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_DEBUG: "0"
        working-directory: services/nsi
        run: |
          python manage.py check
          python manage.py test nsi_service.tests -v 2
          python manage.py makemigrations --check --dry-run
      - name: Django checks (Documents)
        env:
          DATABASE_URL: sqlite:////tmp/documents.sqlite3
          KEYCLOAK_ISSUER: http://localhost/realms/uom
          KEYCLOAK_JWKS_URL: http://localhost/jwks
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_DEBUG: "0"
          CELERY_BROKER_URL: amqp://ci:ci@localhost:5672//
          CONVERSION_BASE_URL: http://localhost:8003
          KEYCLOAK_TOKEN_URL: http://localhost/realms/uom/protocol/openid-connect/token
          S2S_CLIENT_SECRET: ci-secret
          MINIO_INTERNAL_ENDPOINT: localhost:9000
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minio
          MINIO_SECRET_KEY: minio
        working-directory: services/documents
        run: |
          python manage.py check
          python manage.py test documents_service.tests -v 2
          python manage.py makemigrations --check --dry-run
      - name: Collect e2e tests (import-only; env stubs)
        env:
          RABBITMQ_DEFAULT_PASS: ci_collect_stub
          SEED_PASSWORD: ci_collect_stub
        run: pytest -q --collect-only services/e2e/tests

  e2e-smoke:
    runs-on: ubuntu-latest
    needs:
      - dockerfile-nonroot
      - vps-compose-security
      - frontend-quality
      - backend-quality
    timeout-minutes: 30
    env:
      CONVERTER_FQDN: localhost
      CONVERTER_PUBLIC_ORIGIN: http://localhost:5173
      CONVERTER_KEYCLOAK_ISSUER_PUBLIC: http://keycloak:8080/auth/realms/uom
      CONVERTER_ALLOWED_HOSTS: localhost,127.0.0.1,nsi,documents
      KC_HOSTNAME: http://keycloak:8080/auth
      KC_HOSTNAME_ADMIN: http://keycloak:8080/auth
      KC_HOSTNAME_STRICT: "false"
      CONVERTER_POSTGRES_TLS_ENABLED: on
      RABBITMQ_DEFAULT_USER: converter_ci_mq
      RABBITMQ_DEFAULT_PASS: ci_rabbitmq_password
      MINIO_ROOT_USER: ci_minio_storage
      MINIO_ROOT_PASSWORD: ci_minio_password
      KEYCLOAK_DB_PASSWORD: ci_keycloak_db_password
      NSI_DB_PASSWORD: ci_nsi_db_password
      DOCUMENTS_DB_PASSWORD: ci_documents_db_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ci_keycloak_admin_password
      NSI_DJANGO_SECRET_KEY: ci_nsi_secret
      DOCS_DJANGO_SECRET_KEY: ci_docs_secret
      S2S_CLIENT_SECRET: ci_s2s_secret
      NSI_DATABASE_URL: postgres://nsi:ci_nsi_db_password@nsi_db:5432/nsi?sslmode=verify-full&sslrootcert=/etc/postgresql/tls/root.crt
      DOCUMENTS_DATABASE_URL: postgres://documents:ci_documents_db_password@documents_db:5432/documents?sslmode=verify-full&sslrootcert=/etc/postgresql/tls/root.crt
      KC_DB_TLS_MODE: verify-server
      KC_DB_TLS_TRUST_STORE_FILE: /etc/postgresql/tls/root.crt
      SEED_PASSWORD: ci_operator_password
    steps:
      - uses: actions/checkout@v4
      - name: Provision compose TLS (CI)
        run: |
          set -euo pipefail
          chmod +x deploy/vps/generate-postgres-tls.sh deploy/vps/generate-rabbitmq-mtls.sh deploy/vps/generate-minio-tls.sh
          ./deploy/vps/generate-postgres-tls.sh
          ./deploy/vps/generate-rabbitmq-mtls.sh
          ./deploy/vps/generate-minio-tls.sh
      - name: Up SB stack for e2e
        run: |
          docker compose -f docker-compose.vps.yml up -d --build \
            keycloak_db keycloak rabbitmq minio nsi_db documents_db \
            nsi documents documents_worker conversion seed
      - name: Wait for Keycloak (production start is slower than start-dev)
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if docker compose -f docker-compose.vps.yml exec -T keycloak \
              sh -c 'wget -q -O- http://127.0.0.1:8080/auth/realms/uom >/dev/null 2>&1'; then
              echo "Keycloak ready (~$((i * 2))s)"
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.vps.yml ps
          docker compose -f docker-compose.vps.yml logs keycloak --tail 120
          exit 1
      - name: Run e2e
        run: docker compose -f docker-compose.vps.yml --profile tools run --rm e2e
      - if: always()
        run: docker compose -f docker-compose.vps.yml down -v
