# Только для форка vvv-web/converter.
# Зеркалит main форка на test канона (руководитель): reset --hard + push --force-with-lease.
# На main форка не ведём своих коммитов. Остальные ветки (в т.ч. test форка / СБ) не трогаем.
#
# ВАЖНО (GitHub Actions): событие schedule берёт workflow из ветки по умолчанию репозитория.
# Если default branch = main (и на main нет этого файла — так и должно быть при зеркале),
# cron не выполнится. Варианты: сделать default branch форка = test; или убрать schedule
# и запускать вручную (workflow_dispatch) / через внешний cron + gh workflow run.
#
# Отключите в настройках форка автоматический «Sync fork», если он мешает.

name: Sync fork main from upstream test

on:
  workflow_dispatch:
  schedule:
    # Ежедневно 05:00 UTC; при необходимости измените cron
    - cron: "0 5 * * *"

concurrency:
  group: sync-fork-main-upstream-test
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'vvv-web/converter'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream (канон) test
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/vldsmelov/converter.git
          git fetch upstream test

      # main форка = точная копия upstream test (без собственных коммитов на main).
      - name: Выравнять main по upstream/test (mirror)
        run: |
          set -euo pipefail
          git checkout main
          git reset --hard upstream/test

      - name: Push main (force-with-lease)
        run: git push origin main --force-with-lease
