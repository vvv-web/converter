# Локальная разработка: порты на всех интерфейсах — удобно, но не схема для внешнего контура (СБ).
# Прод / VPS: см. docker-compose.vps.yml и deploy/vps/README.md (форк vvv-web — полигон перед merge в test канона).

x-postgres-tls-command: &postgres_tls_command
  - postgres
  - -c
  - ssl=${CONVERTER_POSTGRES_TLS_ENABLED:-off}
  - -c
  - ssl_cert_file=/etc/postgresql/tls/server.crt
  - -c
  - ssl_key_file=/etc/postgresql/tls/server.key

services:
  rabbitmq:
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-converter_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    # Local/CI named volumes start root-owned, so default to root here.
    # SB-hardened non-root MinIO remains enforced in docker-compose.vps.yml.
    user: "${MINIO_UID:-0}:${MINIO_GID:-0}"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak_db:
    image: postgres:16-alpine
    command: *postgres_tls_command
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
      - ./deploy/vps/postgres-tls/keycloak_db:/etc/postgresql/tls:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6@sha256:8d44614c74798322c4e07fbe0ecb15cfbb5879d69b484628555f58ade06f0d8c
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak_db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_DB_TLS_MODE: ${KC_DB_TLS_MODE:-disabled}
      KC_DB_TLS_TRUST_STORE_FILE: ${KC_DB_TLS_TRUST_STORE_FILE:-/etc/postgresql/tls/root.crt}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import
      - ./deploy/vps/postgres-tls:/etc/postgresql/tls:ro
    depends_on:
      - keycloak_db

  nsi_db:
    image: postgres:16-alpine
    command: *postgres_tls_command
    environment:
      POSTGRES_DB: nsi
      POSTGRES_USER: nsi
      POSTGRES_PASSWORD: ${NSI_DB_PASSWORD:?set NSI_DB_PASSWORD}
    volumes:
      - nsi_db:/var/lib/postgresql/data
      - ./deploy/vps/postgres-tls/nsi_db:/etc/postgresql/tls:ro

  documents_db:
    image: postgres:16-alpine
    command: *postgres_tls_command
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: documents
      POSTGRES_PASSWORD: ${DOCUMENTS_DB_PASSWORD:?set DOCUMENTS_DB_PASSWORD}
    volumes:
      - documents_db:/var/lib/postgresql/data
      - ./deploy/vps/postgres-tls/documents_db:/etc/postgresql/tls:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documents -d documents"]
      interval: 5s
      timeout: 5s
      retries: 20

  nsi:
    build: ./services/nsi
    environment:
      DJANGO_SECRET_KEY: ${NSI_DJANGO_SECRET_KEY:?set NSI_DJANGO_SECRET_KEY}
      DATABASE_URL: ${NSI_DATABASE_URL:?set NSI_DATABASE_URL}
      DJANGO_DEBUG: "1"
      ALLOWED_HOSTS: "*"
      OPENAPI_PUBLIC_ENABLED: "1"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      KEYCLOAK_ISSUER: http://localhost:8080/realms/uom,http://keycloak:8080/realms/uom
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/uom/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_REALM: uom
      KEYCLOAK_ADMIN_AUTH_REALM: master
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8001:8000"
    depends_on:
      - nsi_db
      - keycloak
    command: >-
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./services/nsi:/app

  documents:
    build: ./services/documents
    environment:
      DJANGO_SECRET_KEY: ${DOCS_DJANGO_SECRET_KEY:?set DOCS_DJANGO_SECRET_KEY}
      DATABASE_URL: ${DOCUMENTS_DATABASE_URL:?set DOCUMENTS_DATABASE_URL}
      DJANGO_DEBUG: "1"
      ALLOWED_HOSTS: "*"
      OPENAPI_PUBLIC_ENABLED: "1"
      KEYCLOAK_ISSUER: http://localhost:8080/realms/uom,http://keycloak:8080/realms/uom
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/uom/protocol/openid-connect/certs
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-converter_mq}:${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CONVERSION_BASE_URL: http://conversion:8000
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/uom/protocol/openid-connect/token
      S2S_CLIENT_ID: documents-service
      S2S_CLIENT_SECRET: ${S2S_CLIENT_SECRET:?set S2S_CLIENT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_PUBLIC_SECURE: "0"
      MINIO_INTERNAL_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "8002:8000"
    depends_on:
      - documents_db
      - rabbitmq
      - keycloak
      - minio
    command: >-
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./services/documents:/app

  documents_worker:
    build: ./services/documents
    environment:
      DJANGO_SECRET_KEY: ${DOCS_DJANGO_SECRET_KEY:?set DOCS_DJANGO_SECRET_KEY}
      DATABASE_URL: ${DOCUMENTS_DATABASE_URL:?set DOCUMENTS_DATABASE_URL}
      DJANGO_DEBUG: "1"
      ALLOWED_HOSTS: "*"
      KEYCLOAK_ISSUER: http://localhost:8080/realms/uom,http://keycloak:8080/realms/uom
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/uom/protocol/openid-connect/certs
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-converter_mq}:${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CONVERSION_BASE_URL: http://conversion:8000
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/uom/protocol/openid-connect/token
      S2S_CLIENT_ID: documents-service
      S2S_CLIENT_SECRET: ${S2S_CLIENT_SECRET:?set S2S_CLIENT_SECRET}
      MINIO_INTERNAL_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_PUBLIC_SECURE: "0"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    depends_on:
      documents_db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate && celery -A documents_service worker -l info"
    volumes:
      - ./services/documents:/app

  conversion:
    build: ./services/conversion
    environment:
      NSI_BASE_URL: http://nsi:8000
      KEYCLOAK_ISSUER: http://localhost:8080/realms/uom,http://keycloak:8080/realms/uom
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/uom/protocol/openid-connect/certs
    ports:
      - "8003:8000"
    depends_on:
      - nsi

  # one-shot demo seeding (idempotent)
  seed:
    build: ./services/seed
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      NSI_URL: http://nsi:8000
      DOCS_URL: http://documents:8000
      SEED_USERNAME: operator
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD}
      SEED_CLIENT_ID: uom-cli
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      S2S_CLIENT_ID: documents-service
      S2S_CLIENT_SECRET: ${S2S_CLIENT_SECRET:?set S2S_CLIENT_SECRET}
    depends_on:
      - keycloak
      - nsi
      - documents
    restart: "no"

  e2e:
    build: ./services/e2e
    profiles: ["tools"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      NSI_URL: http://nsi:8000
      DOCS_URL: http://documents:8000
      DOCUMENTS_URL: http://documents:8000
      ORIGIN: http://localhost:5173
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-converter_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
      SEED_PASSWORD: ${SEED_PASSWORD:?set SEED_PASSWORD}
    depends_on:
      - keycloak
      - nsi
      - documents
      - conversion
    command: ["pytest", "-q", "tests/test_end_to_end.py"]

  frontend:
    image: node:20-alpine
    profiles: ["ui"]
    working_dir: /repo/frontend
    volumes:
      - ./:/repo
    ports:
      - "5173:5173"
    environment:
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: uom
      VITE_KEYCLOAK_CLIENT_ID: frontend
      VITE_DOCS_BASE_URL: http://localhost:8002
      VITE_NSI_BASE_URL: http://localhost:8001
    depends_on:
      - keycloak
      - documents
      - nsi
      - seed
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]

volumes:
  keycloak_db:
  nsi_db:
  documents_db:
  minio_data:
