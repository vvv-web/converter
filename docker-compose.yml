# Ветка sb-security-fixes: единственный стек — hardened VPS compose (СБ + prod + локально + CI).
# Секреты: deploy/vps/.env.example → .env (или /etc/converter/.env на VPS).
# Перед первым up: ./scripts/compose-preflight-tls.sh
#
# Явный файл (как на VPS): docker compose -f docker-compose.vps.yml --env-file .env …
# Без -f: этот include подхватывает тот же манифест.

include:
  - path: docker-compose.vps.yml
