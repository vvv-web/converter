# Установка на VPS:
#   sudo cp deploy/vps/nginx-converter.acom-offer-desk.ru.conf /etc/nginx/sites-available/converter.acom-offer-desk.ru
#   sudo ln -sf /etc/nginx/sites-available/converter.acom-offer-desk.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d converter.acom-offer-desk.ru --non-interactive --agree-tos --redirect
# (email подтянется из существующего аккаунта certbot; при ошибке добавьте -m ваш@email)

server {
    listen 80;
    listen [::]:80;
    server_name converter.acom-offer-desk.ru;

    client_max_body_size 80m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # MinIO S3 API: bucket documents → /documents/...
    location ^~ /documents/ {
        proxy_pass http://127.0.0.1:29000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:18080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /nsi/ {
        proxy_pass http://127.0.0.1:18001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
        proxy_pass http://127.0.0.1:18002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /conversion/ {
        rewrite ^/conversion/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/converter;
        try_files $uri $uri/ /index.html;
    }
}
